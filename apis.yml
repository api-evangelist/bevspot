aid: bevspot
name: BevSpot
description: 'BevSpot is a Boston-based food and beverage inventory management platform
  for restaurants, bars, and hospitality groups. The web application streamlines back-of-house
  operations including inventory counting, ordering, invoice management, recipe and menu
  costing, and sales-driven analytics. BevSpot ingests point-of-sale data through integrations
  with more than a dozen POS systems (Toast, Square, Clover, Lightspeed, SpotOn, NCR Aloha,
  Upserve, Brink, Lavu, and others), plus accounting and vendor connections (QuickBooks,
  Microsoft Dynamics GP, Ottimate, Fintech, US Foods, Sysco). It is a portfolio company of
  Bain Capital Ventures. BevSpot does not currently publish a public developer API, SDK, or
  developer portal; this profile captures its public web, commercial, and security surface.'
